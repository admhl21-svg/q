
<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VOLT IS STARTING...</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    width: 100%;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #e8f5ff;
    background:
        linear-gradient(135deg, rgba(2,8,20,.90), rgba(0,18,42,.90)),
        url('background.jpg') center/cover no-repeat fixed;
}

/* BRAND */
#brand {
    position: fixed;
    top: 28px;
    left: 0;
    width: 100%;
    text-align: center;
}

#brand b {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    color: white;
    text-shadow:
        0 0 8px #00aaff,
        0 0 20px #0077ff,
        0 0 40px #0055ff;
}

/* STARTING BOX */
#ramBox {
    position: fixed;
    top: calc(50% - 75px);
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(4,20,42,.88);
    border: 1px solid rgba(0,160,255,.65);
    border-radius: 15px;
    box-shadow:
        0 0 20px rgba(0,140,255,.25),
        inset 0 0 20px rgba(0,100,255,.08);
    text-shadow: 0 0 12px #008cff;
}

/* LOADING SPINNER */
#spin {
    position: fixed;
    top: calc(50% + 20px);
    left: 50%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border: 4px solid rgba(30,80,120,.35);
    border-top-color: #00aaff;
    border-right-color: #0077ff;
    border-radius: 50%;
    animation: spin .85s linear infinite;
    filter: drop-shadow(0 0 8px #008cff);
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ERROR MESSAGE */
#msg {
    position: fixed;
    top: 50%;
    left: 5%;
    right: 5%;
    transform: translateY(-50%);
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    color: #ff7777;
    text-shadow: 0 0 12px rgba(255,50,50,.5);
    display: none;
}

/* LOG CONTAINER */
#wrap {
    padding: 0;
}

#state,
#out {
    display: none;
}

body.done #spin {
    display: none;
}

body.fail #spin,
body.fail #ramBox {
    display: none;
}

body.fail #msg {
    display: block;
}

/* LOG MODE */
body.log #spin,
body.log #msg,
body.log #ramBox {
    display: none;
}

body.log #wrap {
    padding: 20px;
}

body.log #state {
    display: block;
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 15px;
    color: #00aaff;
    text-shadow: 0 0 10px #0077ff;
}

body.log #out {
    display: block;
    white-space: pre-wrap;
    font: 12px/1.6 Consolas, monospace;
    color: #d5eaff;
    background: rgba(3,12,25,.95);
    border: 1px solid #087ac0;
    border-radius: 10px;
    padding: 15px;
    height: calc(100vh - 100px);
    overflow-y: auto;
    box-shadow: 0 0 15px rgba(0,120,255,.15);
}

/* STATUS COLORS */
.ok, .safe {
    color: #7fd0a0;
}

.bad, .danger {
    color: #ff7777;
}

.warn {
    color: #ffd477;
}

code {
    color: #70caff;
}

/* FOOTER */
.byline {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #6385a3;
    font-size: 12px;
    letter-spacing: 2px;
}

@media(max-width:480px) {
    #brand b {
        font-size: 25px;
    }

    #ramBox {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div id="brand">
    <b>VOLT - فولت</b>
</div>

<div id="ramBox">
    يتم التشغيل
</div>

<div id="spin"></div>

<div id="msg">
    يرجى إعادة تشغيل الجهاز
</div>

<div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
</div>

<p class="byline">PS4 14.00 JAILBREAK | POWERED BY VOLT</p>

<script type="module">
import "./jb.js";
</script>

</body>
</html>
