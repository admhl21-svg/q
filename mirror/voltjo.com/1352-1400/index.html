
<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VOLT 14.00</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e8f4ff;
    background:
        linear-gradient(135deg, rgba(2,8,20,.92), rgba(0,20,45,.88)),
        url('background.jpg') center/cover no-repeat fixed;
}

/* BRAND */
#brand {
    position: relative;
    text-align: center;
    padding: 25px 10px;
}

#brand b {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    text-shadow:
        0 0 8px #00aaff,
        0 0 20px #0077ff,
        0 0 40px #0055ff;
}

/* MAIN CONTAINER */
.shell {
    width: 90%;
    max-width: 650px;
    margin: 15px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

/* MEME IMAGE */
.volt {
    width: 100%;
    max-width: 320px;
    max-height: 220px;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0,150,255,.4));
    border-radius: 12px;
}

/* MAIN PANEL */
.panel {
    width: 100%;
    padding: 30px 25px;
    background: rgba(5,17,35,.88);
    border: 1px solid rgba(0,160,255,.6);
    border-radius: 18px;
    box-shadow:
        0 0 15px rgba(0,140,255,.25),
        0 0 40px rgba(0,80,255,.15),
        inset 0 0 20px rgba(0,120,255,.08);
    text-align: center;
}

/* TITLE */
.lede {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    margin: 0 0 28px;
    text-shadow: 0 0 15px #008cff;
}

/* OPTIONS */
.pick {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
}

.opt {
    width: 100%;
    max-width: 350px;
    min-height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    background: rgba(0,80,150,.12);
    border: 1px solid #174b78;
    border-radius: 12px;
    cursor: pointer;
    transition: .25s ease;
}

.opt:hover {
    background: rgba(0,140,255,.2);
    border-color: #00aaff;
    box-shadow: 0 0 15px rgba(0,150,255,.35);
}

.opt span {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #eaf6ff;
}

.opt input {
    width: 18px;
    height: 18px;
    accent-color: #009dff;
    cursor: pointer;
}

/* AUTOMATIC */
.opt-auto {
    border-color: #087e9e;
    background: rgba(0,180,220,.08);
}

/* COUNTERS */
.count {
    color: #65caff;
    font-size: 14px;
    font-weight: 600;
    margin: 5px 0;
    text-shadow: 0 0 8px rgba(0,150,255,.5);
}

/* FOOTER */
.byline {
    text-align: center;
    color: #65849e;
    font-size: 12px;
    letter-spacing: 2px;
    margin: 25px 0;
}

/* LOADING */
#spin {
    position: fixed;
    top: calc(50% + 20px);
    left: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border: 4px solid #1e2732;
    border-top-color: #00aaff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#msg {
    position: fixed;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    text-align: center;
    font-size: 16px;
    display: none;
}

#wrap { padding: 0; }
#state, #out { display: none; }

body.done #spin,
body.fail #spin {
    display: none;
}

body.fail #msg {
    display: block;
}

body.log #spin,
body.log #msg {
    display: none;
}

body.log #wrap {
    padding: 14px 18px;
}

body.log #state {
    display: block;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
}

body.log #out {
    display: block;
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: #11151b;
    border: 1px solid #1e2732;
    border-radius: 8px;
    padding: 12px;
    height: calc(100vh - 141px);
    overflow-y: auto;
}

/* STATUS COLORS */
.ok, .safe { color: #7fd0a0; }
.bad, .danger { color: #ff7777; }
.warn { color: #ffd477; }

code {
    color: #70caff;
}

/* MOBILE */
@media (max-width: 480px) {
    #brand b {
        font-size: 25px;
    }

    .panel {
        padding: 24px 16px;
    }

    .lede {
        font-size: 23px;
    }
}
</style>
</head>

<body>



<div class="shell">

    <img class="volt" src="volt.png" alt="VOLT">
<div id="brand">
    <b>VOLT - فولت</b>
</div>
    <main class="panel">

        <p class="lede">VOLT - فولت</p>

        <form class="pick" id="pick">

            <label class="opt">
                <input type="radio" name="payload" value="hen">
                <span>HEN</span>
            </label>

            <label class="opt">
                <input type="radio" name="payload" value="goldhen" checked>
                <span>GoldHEN</span>
            </label>

            <label class="opt opt-auto">
                <input type="checkbox" id="auto" checked>
                <span>Automatic</span>
            </label>

            <p class="count" id="count"></p>

            <p class="count" id="cache" aria-live="polite"></p>

        </form>

    </main>

</div>

<p class="byline">+962770582845</p>

<script src="launch.js"></script>

</body>
</html>
