<html>
  <head>
    <meta charset="utf-8">
    <title>VOLT Jailbreak {5.05->9.60} </title>
    <style>
      :root {
        --bg: #020B18;
        --accent: #00CFFF;
        --accent-glow: rgba(0,207,255,0.42);
        --poops-c: #A855F7;
        --success: #00E676;
        --error: #FF5252;
        --warn: #FFD600;
        --text: #B8DCFF;
        --text-muted: #4E82A0;
        --text-dim: #081E35;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;

        background-color: var(--bg);

        background-image:
          radial-gradient(
            ellipse 100% 50% at 50% -5%,
            rgba(0,150,255,0.16) 0%,
            transparent 65%
          ),
          radial-gradient(
            ellipse 50% 45% at 100% 100%,
            rgba(80,0,200,0.08) 0%,
            transparent 55%
          ),
          linear-gradient(
            var(--text-dim) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            var(--text-dim) 1px,
            transparent 1px
          );

        background-size:
          100% 100%,
          100% 100%,
          32px 32px,
          32px 32px;

        color: var(--text);
        height: 100vh;
        overflow: hidden;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 18px;
        position: relative;
      }

      /* Scanlines */
      body::after {
        content: '';
        position: fixed;
        inset: 0;

        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 2px,
          rgba(0,60,140,0.06) 2px,
          rgba(0,60,140,0.06) 3px
        );

        pointer-events: none;
        z-index: 9999;
      }

      /* =========================================
         RGB BORDER
      ========================================= */

      @keyframes rgb-cycle {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .rgb-shell {
        width: 100%;
        max-width: 960px;
        height: calc(100vh - 36px);

        padding: 2px;
        border-radius: 14px;

        background: linear-gradient(
          60deg,
          #ff2020,
          #ff7700,
          #ffee00,
          #00ff55,
          #00cfff,
          #0055ff,
          #9900ff,
          #ff00cc,
          #ff2020
        );

        background-size: 400% 400%;
        animation: rgb-cycle 4s linear infinite;

        box-shadow:
          0 0 25px rgba(0,150,255,0.40),
          0 0 60px rgba(0,100,255,0.20),
          0 0 120px rgba(0,50,255,0.10),
          0 28px 70px rgba(0,0,0,0.75);

        display: flex;
        flex-direction: column;

        z-index: 1;
      }

      .shell {
        flex: 1;

        display: flex;
        flex-direction: column;

        border-radius: 12px;
        overflow: hidden;
        min-height: 0;

        background: rgba(3,8,18,0.92);
      }
      .topbar {
        background: linear-gradient(
          135deg,
          #08152E 0%,
          #050E20 100%
        );
        padding: 13px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .topbar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 55%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0,207,255,0.70),
          transparent
        );
      }
      .topbar::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0,207,255,0.45),
          transparent
        );
        box-shadow:
          0 0 10px rgba(0,207,255,0.40);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-icon {
        width: 38px;
        height: 38px;
        background: linear-gradient(
          135deg,
          rgba(0,207,255,0.18),
          rgba(0,207,255,0.05)
        );
        border: 1px solid rgba(0,207,255,0.38);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        animation: icon-pulse 3s ease-in-out infinite;
      }
      @keyframes icon-pulse {
        0%, 100% {
          box-shadow:
            0 0 12px rgba(0,207,255,0.22);
        }
        50% {
          box-shadow:
            0 0 28px rgba(0,207,255,0.55),
            0 0 50px rgba(0,207,255,0.18);
        }
      }
      .brand-name {
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
        text-shadow:
          0 0 20px rgba(0,207,255,0.55);
      }
      .brand-sub {
        font-size: 0.67rem;
        font-weight: bold;
        color: var(--text-muted);
        margin-top: 3px;
        letter-spacing: 2.5px;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .version-tag {
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--accent);
        border: 1px solid rgba(0,207,255,0.38);
        background: rgba(0,207,255,0.08);
        padding: 4px 10px;
        border-radius: 5px;
        text-shadow:
          0 0 10px var(--accent-glow);
      }
      #wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background:
          linear-gradient(
            180deg,
            #080E1E 0%,
            #060B18 100%
          );
        padding: 18px;
        gap: 14px;
        position: relative;
      }
      #wrap::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 80% 40% at 50% 0%,
            rgba(0,120,255,0.05) 0%,
            transparent 60%
          );
        pointer-events: none;
      }
      .title-section {
        position: relative;
        z-index: 1;
        text-align: center;
        flex-shrink: 0;
      }
      .main-title {
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 3px;
        color: #fff;
        text-shadow:
          0 0 10px rgba(0,207,255,0.55),
          0 0 25px rgba(0,207,255,0.25);
      }
      .title-line {
        width: 55%;
        max-width: 420px;
        height: 1px;
        margin: 8px auto 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0,207,255,0.65),
          transparent
        );
        box-shadow:
          0 0 10px rgba(0,207,255,0.35);
      }
      .console-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
        z-index: 1;
      }
      .console-bar {
        background: rgba(3,8,18,0.88);
        border: 1px solid rgba(168,85,247,0.28);
        border-bottom: 1px solid rgba(168,85,247,0.12);
        border-radius: 8px 8px 0 0;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .console-title {
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 2px;
        color: white;
        flex: 1;
        text-align: center;
        text-shadow:
          0 0 8px rgba(168,85,247,0.55);
      }
      #console {
        flex: 1;
        min-height: 0;
        width: 100%;
        font-family:
          Consolas,
          "Courier New",
          monospace;
        font-size: 14px;
        line-height: 1.65;
        color: #B8DCFF;
        text-align: left;
        background: rgba(2,5,12,0.38);
        border: 1px solid rgba(168,85,247,0.22);
        border-top: none;
        border-radius: 0 0 8px 8px;
        padding: 14px;
        overflow-y: auto;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color:
          rgba(168,85,247,0.30)
          transparent;
        text-shadow:
          0 0 8px rgba(0,207,255,0.10);
        box-shadow:
          inset 0 0 25px rgba(0,0,0,0.20),
          0 0 15px rgba(168,85,247,0.04);
      }
      #console::-webkit-scrollbar {
        width: 5px;
      }
      #console::-webkit-scrollbar-track {
        background: transparent;
      }
      #console::-webkit-scrollbar-thumb {
        background:
          rgba(168,85,247,0.30);

        border-radius: 3px;
      }
      .foot-inner {
        flex-shrink: 0;
        background: #060B18;
        border-top:
          1px solid rgba(0,100,180,0.08);
        text-align: center;
        font-size: 0.62rem;
        color: #31516A;
        padding: 6px 0;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 1;
      }
      @media (max-width: 480px) {
        body {
          padding: 10px;
        }
        .rgb-shell {
          height: calc(100vh - 20px);
        }
        .topbar {
          padding: 10px 14px;
        }
        #wrap {
          padding: 12px;
          gap: 10px;
        }
        .main-title {
          font-size: 1.05rem;
          letter-spacing: 1.5px;
        }
        #console {
          font-size: 12px;
        }
        .brand-name {
          font-size: 0.82rem;
        }
        .brand-sub {
          font-size: 0.58rem;
        }
      }
    </style>
   <script>
      if (window.applicationCache.status === 0) {

      }
    </script>

  <script>
    window.entrypoint672_result = 0;
    window.exploitsetup672_result = 0;

    };

    window.getScriptES5 = function (source, callback) {
      var gs = document.createElement('script');
      gs.src = source;
      gs.onload = callback;
      gs.async = false;
      document.body.appendChild(gs);
    }

    window.addEventListener('error', function (event) {
      var reason = event.error;
      var msg = 'Unhandled error\n';
      if (reason) {
        msg += reason + '\n';
        if (reason.sourceURL) msg += reason.sourceURL;
        if (reason.line)      msg += ':' + reason.line;
        if (reason.column)    msg += ':' + reason.column;
        if (reason.stack)     msg += '\n' + reason.stack;
      } else {
        msg += 'No error object';
      }
      alert(msg);
      return true;
    });

    window.checkPlatformIsSupported = function () {

      var psRegex = /PlayStation (4|5)[ \/]([0-9]{1,2}\.[0-9]{2})/;
      var match = userAgent.match(psRegex);
      if (!match) return false;
      var device = match[1];

      window.log(
        "Firmware PS" + device + " ini: " + fwVersion + "\n"
      );
      var supportedFW = {
        "4": [
          "5.05","6.70","6.71","6.72",

          "7.50","7.51","7.55",
          "8.00","8.01","8.03",
          "8.50","8.52",
          "9.00","9.03","9.04",
          "9.50","9.51","9.60"
        ],
        "5": ["0.00"]
      };
      if (!supportedFW[device]) return false;
      return supportedFW[device].indexOf(fwVersion) !== -1;
    }

    window.addEventListener('load', function () {

      try {

          } else {

            window.getScriptES5('main.js', function () {

            });
          }
        }
      } catch (error) {

      }
    });
  </script>
