<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLT Jailbreak {11.50->13.00} </title>
<style>
    :root {
        --bg:          #020B18;
        --surface:     #060F24;
        --accent:      #00CFFF;
        --accent-dim:  rgba(0,207,255,0.10);
        --accent-glow: rgba(0,207,255,0.42);
        --success:     #00E676;
        --error:       #FF5252;
        --warn:        #FFD600;
        --text:        #B8DCFF;
        --text-muted:  #4E82A0;
        --text-dim:    #081E35;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        background-image:
            radial-gradient(ellipse 100% 50% at 50% -5%, rgba(0,150,255,0.16) 0%, transparent 65%),
            radial-gradient(ellipse 50% 40% at 100% 100%, rgba(80,0,200,0.08) 0%, transparent 55%),
            linear-gradient(var(--text-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--text-dim) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 20px 56px;
        position: relative;
    }
    body::after {
        content: '';
        position: fixed; inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px, transparent 2px,
            rgba(0,60,140,0.06) 2px, rgba(0,60,140,0.06) 3px
        );
        pointer-events: none;
        z-index: 9999;
    }
    @keyframes rgb-cycle {
        0%   { background-position: 0%   50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0%   50%; }
    }
    .rgb-shell {
        width: 100%;
        max-width: 800px;
        padding: 2px;
        border-radius: 14px;
        background: linear-gradient(
            60deg,
            #ff2020, #ff7700, #ffee00,
            #00ff55, #00cfff, #0055ff,
            #9900ff, #ff00cc, #ff2020
        );
        background-size: 400% 400%;
        animation: rgb-cycle 4s linear infinite;
        box-shadow:
            0 0 25px  rgba(0,150,255,0.40),
            0 0 60px  rgba(0,100,255,0.20),
            0 0 120px rgba(0,50,255,0.10),
            0 28px 70px rgba(0,0,0,0.75);
        position: relative;
        z-index: 1;
    }
    .shell {
        width: 100%;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;}
    .topbar {
        background: linear-gradient(135deg, #08152E 0%, #050E20 100%);
        padding: 18px 26px;
        display: flex; align-items: center; justify-content: space-between;
        position: relative; overflow: hidden;}
    .topbar::before {
        content: '';
        position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 55%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.70), transparent);}
    .topbar::after {
        content: '';
        position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.45), transparent);
        box-shadow: 0 0 10px rgba(0,207,255,0.40);}
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
        width: 44px; height: 44px;
        background: linear-gradient(135deg, rgba(0,207,255,0.18), rgba(0,207,255,0.05));
        border: 1px solid rgba(0,207,255,0.38);
        border-radius: 9px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.35rem;
        animation: icon-pulse 3s ease-in-out infinite;
    }
    @keyframes icon-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(0,207,255,0.22); }
        50%       { box-shadow: 0 0 30px rgba(0,207,255,0.55), 0 0 55px rgba(0,207,255,0.18); }
    }
    .brand-name {
        font-size: 1rem; font-weight: bold; letter-spacing: 3px;
        text-transform: uppercase; color: #fff;
        text-shadow: 0 0 20px rgba(0,207,255,0.55);
    }
    .brand-sub { font-size: 0.67rem; font-weight:bold; color: var(--text-muted); margin-top: 3px; letter-spacing:2.5px; }

    .version-tag {
        font-size: 0.72rem; font-weight: 800; letter-spacing: 2px;
        color: var(--accent);
        border: 1px solid rgba(0,207,255,0.38);
        background: rgba(0,207,255,0.08);
        padding: 5px 12px; border-radius: 5px;
        text-shadow: 0 0 10px var(--accent-glow);
        box-shadow: 0 0 14px rgba(0,207,255,0.14), inset 0 0 10px rgba(0,207,255,0.04);
    }
    #wrap {
        background: linear-gradient(180deg, #080E1E 0%, #060B18 100%);
        padding: 56px 36px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        min-height: 320px;
        justify-content: center;
        text-align: center;
        position: relative;
    }
    #wrap::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,150,255,0.06) 0%, transparent 70%);
        pointer-events: none;
    }
    #wrap::after {
        content: '';
        position: absolute; inset: 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 4px,
            rgba(0,80,160,0.035) 4px, rgba(0,80,160,0.035) 5px
        );
        pointer-events: none;
    }
    .state-eyebrow {
        display: flex; align-items: center; gap: 12px;
        font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
        color: var(--accent); opacity: 0.72;
        position: relative; z-index: 1;
    }
    .state-eyebrow span { display: block; width: 32px; height: 1px; }
    .state-eyebrow span:first-child  { background: linear-gradient(90deg,  transparent, rgba(0,207,255,0.65)); }
    .state-eyebrow span:last-child   { background: linear-gradient(270deg, transparent, rgba(0,207,255,0.65)); }
    #state {
        font-size: 1.55rem; font-weight: 800;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 30px rgba(0,207,255,0.42), 0 2px 20px rgba(0,0,0,0.5);
        direction: rtl; text-align: center;
        position: relative; z-index: 1;
        line-height: 1.4;
        max-width: 580px;
    }
    #state.bad {
        color: var(--error);
        text-shadow: 0 0 30px rgba(255,82,82,0.65), 0 2px 20px rgba(0,0,0,0.5);
    }
    #state.warn {
        color: var(--warn);
        text-shadow: 0 0 30px rgba(255,214,0,0.55), 0 2px 20px rgba(0,0,0,0.5);
        animation: warn-pulse 1.6s ease-in-out infinite;
    }
    @keyframes warn-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.45; }
    }
    .divider {
        width: 100%; max-width: 380px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,150,255,0.20), transparent);
        position: relative; z-index: 1;
    }
    #det {
        font-size: 0.80rem;
        color: var(--text-muted);
        text-align: center;
        position: relative; z-index: 1;
        line-height: 1.9;
        max-width: 520px;
    }
    #det b { color: var(--accent); font-weight: 700; }
    #cache {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: center; direction: rtl;
        position: relative; z-index: 1;
        min-height: 1.2em;
        transition: color 0.35s;
    }
    #cache.cacheok {
        color: var(--success);
        text-shadow: 0 0 10px rgba(0,230,118,0.40);
    }
    .foot {
        text-align: center; font-size: 1rem; color: var(--text-muted);
        padding-top: 30px;
		font-weight:bold;
        display: flex; flex-direction: column; gap: 4px; line-height: 1.8;
    }
    @media (max-width: 480px) {
        #wrap   { padding: 40px 18px 32px; }
        .topbar { padding: 14px 16px; }
        #state  { font-size: 1.2rem; }
    }
</style>
</head>
<body>
<div class="rgb-shell">
  <div class="shell">
    <header class="topbar">
        <div class="brand">
           <div class="brand-icon">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="13,2 4,14 12,14 11,22 20,10 12,10" 
             fill="#00CFFF" 
             stroke="#00CFFF" 
             stroke-width="0.5"/>
  </svg>
</div>
            <div>
                <div class="brand-name">VOLT PS4 JAILBREAK</div>
                <div class="brand-sub">+962770582845</div>
            </div>
        </div>
        <div class="version-tag">V4.0</div>
    </header>
    <div id="wrap">
        <div class="state-eyebrow">
            <span></span>
           PS4 منصة تهكير 
            <span></span>
        </div>
        <div id="state">VOLT يكشف الإصدار...</div>
        <div class="divider"></div>
        <div id="det"></div>
        <div id="cache"></div>
    </div>
  </div>
</div>
<footer class="foot">
    <p>© VOLT — +962770582845</p>
    <p> الزرقاء - الوسط التجاري - شارع الملك فيصل </p>
</footer>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- Tekan tombol Enter  X/O",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- Tekan tombol Enter  X/O", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- Tekan tombol Enter  X/O",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- Tekan tombol Enter  X/O", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- Tekan tombol Enter  X/O", go);
        }, false);
    }
})();
</script>
</body>
</html>
