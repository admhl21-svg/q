<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLT Poops</title>
<style>
    :root {
        --bg:           #020B18;
        --surface:      #060F24;
        --accent:       #00CFFF;
        --accent-glow:  rgba(0,207,255,0.42);
        --poops-c:      #A855F7;
        --poops-glow-c: rgba(168,85,247,0.38);
        --success:      #00E676;
        --error:        #FF5252;
        --warn:         #FFD600;
        --text:         #B8DCFF;
        --text-muted:   #4E82A0;
        --text-dim:     #081E35;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        background-image:
            radial-gradient(ellipse 100% 50% at 50% -5%, rgba(0,150,255,0.16) 0%, transparent 65%),
            radial-gradient(ellipse 50% 45% at 100% 100%, rgba(80,0,200,0.08) 0%, transparent 55%),
            linear-gradient(var(--text-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--text-dim) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        height: 100vh; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        padding: 18px; position: relative;
    }
    body::after {
        content: ''; position: fixed; inset: 0;
        background: repeating-linear-gradient(
            0deg, transparent 0px, transparent 2px,
            rgba(0,60,140,0.06) 2px, rgba(0,60,140,0.06) 3px
        );
        pointer-events: none; z-index: 9999;
    }
    .rgb-shell {
        width: 100%; max-width: 960px; height: calc(100vh - 36px);
        padding: 2px; border-radius: 14px;
        background: linear-gradient(60deg,
            #ff2020, #ff7700, #ffee00, #00ff55,
            #00cfff, #0055ff, #9900ff, #ff00cc, #ff2020);
        background-size: 400% 400%;
        box-shadow:
            0 0 25px rgba(0,150,255,0.40), 0 0 60px rgba(0,100,255,0.20),
            0 0 120px rgba(0,50,255,0.10), 0 28px 70px rgba(0,0,0,0.75);
        display: flex; flex-direction: column; z-index: 1;
    }
    .shell {
        flex: 1; display: flex; flex-direction: column;
        border-radius: 12px; overflow: hidden; min-height: 0;
    }
    .topbar {
        background: linear-gradient(135deg, #08152E 0%, #050E20 100%);
        padding: 13px 22px;
        display: flex; align-items: center; justify-content: space-between;
        flex-shrink: 0; position: relative; overflow: hidden;
    }
    .topbar::before {
        content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 55%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.70), transparent);
    }
    .topbar::after {
        content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.45), transparent);
        box-shadow: 0 0 10px rgba(0,207,255,0.40);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
        width: 38px; height: 38px;
        background: linear-gradient(135deg, rgba(0,207,255,0.18), rgba(0,207,255,0.05));
        border: 1px solid rgba(0,207,255,0.38);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        animation: icon-pulse 3s ease-in-out infinite;
    }
    .brand-name {
        font-size: 1rem; font-weight: bold; letter-spacing: 3px;
        text-transform: uppercase; color: #fff;
        text-shadow: 0 0 20px rgba(0,207,255,0.55);
    }
    .brand-sub {
        font-size: 0.67rem; font-weight: bold;
        color: var(--text-muted); margin-top: 3px; letter-spacing: 2.5px;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .poops-badge {
        font-size: 0.66rem; font-weight: 800; letter-spacing: 2px;
        color: var(--poops-c);
        border: 1px solid rgba(168,85,247,0.40);
        background: rgba(168,85,247,0.09);
        padding: 4px 10px; border-radius: 5px;
        text-shadow: 0 0 10px var(--poops-glow-c);
        animation: poops-glow-anim 2.5s ease-in-out infinite;
    }
    .version-tag {
        font-size: 0.66rem; font-weight: 800; letter-spacing: 2px;
        color: var(--accent);
        border: 1px solid rgba(0,207,255,0.38);
        background: rgba(0,207,255,0.08);
        padding: 4px 10px; border-radius: 5px;
        text-shadow: 0 0 10px var(--accent-glow);
    }
    #wrap {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
        background: linear-gradient(180deg, #080E1E 0%, #060B18 100%);
        padding: 14px 18px 12px; gap: 11px; position: relative;
    }
    #wrap::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,120,255,0.05) 0%, transparent 60%);
        pointer-events: none;
    }
    #state {
        font-size: 1.05rem; font-weight: 800; letter-spacing: 0.5px;
        color: #fff; text-shadow: 0 0 20px rgba(0,207,255,0.35);
        direction: rtl; text-align: right;
        flex-shrink: 0; position: relative; z-index: 1;
        line-height: 1.4; padding: 0 2px;
    }
    #state.ok   { color: var(--success); text-shadow: 0 0 20px rgba(0,230,118,0.50); }
    #state.bad  { color: var(--error);   text-shadow: 0 0 20px rgba(255,82,82,0.55); }
    #state.warn {
        color: var(--warn); text-shadow: 0 0 20px rgba(255,214,0,0.50);
        animation: warn-pulse 1.6s ease-in-out infinite;
    }
    .console-wrap {
        flex: 1; display: flex; flex-direction: column;
        min-height: 0; position: relative; z-index: 1;
    }
    .console-bar {
        background: rgba(3, 8, 18, 0.95);
        border: 1px solid rgba(168,85,247,0.28);
        border-bottom: 1px solid rgba(168,85,247,0.12);
        border-radius: 8px 8px 0 0;
        padding: 7px 14px; display: flex; align-items: center; gap: 10px;
        flex-shrink: 0;
    }
    .console-dots { display: flex; gap: 6px; align-items: center; }
    .c-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .c-dot.r { background: #FF5252; box-shadow: 0 0 5px rgba(255,82,82,0.55); }
    .c-dot.y { background: #FFD600; box-shadow: 0 0 5px rgba(255,214,0,0.55); }
    .c-dot.g { background: #00E676; box-shadow: 0 0 5px rgba(0,230,118,0.55); }
    .console-title {
        font-size: 0.63rem; font-weight: 700; letter-spacing: 2px;
        text-transform: uppercase; color: var(--poops-c);
        flex: 1; text-align: center; text-shadow: 0 0 8px var(--poops-glow-c);
    }
    #out {
        flex: 1; min-height: 0; white-space: pre-wrap;
        font: 12px/1.65 Consolas, "Courier New", monospace;
        background: rgba(2, 5, 12, 0.94);
        border: 1px solid rgba(168,85,247,0.22); border-top: none;
        border-radius: 0 0 8px 8px; padding: 12px 14px;
        overflow-y: auto; text-align: left; color: #6A9EBE;
        scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.30) transparent;
    }
    #out::-webkit-scrollbar { width: 5px; }
    #out::-webkit-scrollbar-track { background: transparent; }
    #out::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.30); border-radius: 3px; }
    .ok   { color: #00E676; }
    .bad  { color: #FF5252; }
    .warn { color: #FFD600; }
    .foot-inner {
        flex-shrink: 0; background: #060B18;
        border-top: 1px solid rgba(0,100,180,0.08);
        text-align: center; font-size: 0.62rem; color: #132A3E;
        padding: 5px 0; letter-spacing: 0.5px;
    }
    @media (max-width: 480px) {
        body    { padding: 10px; }
        .topbar { padding: 10px 14px; }
        #wrap   { padding: 12px 12px 10px; }
        #state  { font-size: 0.9rem; }
    }
</style>
</head>
<body>
<div class="rgb-shell">
  <div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <polygon points="13,2 4,14 12,14 11,22 20,10 12,10"
                             fill="#00CFFF" stroke="#00CFFF" stroke-width="0.5"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">VOLT PS4 JAILBREAK</div>
                <div class="brand-sub">+962770582845</div>
            </div>
        </div>
        <div class="topbar-right">
            <div class="poops-badge">POOPS</div>
            <div class="version-tag">V4.0</div>
        </div>
    </header>
    <div id="wrap">
        <div id="state">⏳ جاري تحميل سلسلة Poops...</div>
        <div class="console-wrap">
            <div class="console-bar">
                <div class="console-dots">
                    <div class="c-dot r"></div>
                    <div class="c-dot y"></div>
                    <div class="c-dot g"></div>
                </div>
                <span class="console-title">سجل التنفيذ — سلسلة Poops</span>
            </div>
            <div id="out"></div>
        </div>
    </div>
  </div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
