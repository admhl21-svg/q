<!DOCTYPE html> 
<html lang="en" manifest="CSSFontFace.manifest"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title> VOLT JAILBREAK {10.00->11.02} </title> 
  <link rel="stylesheet" href="includes/style.css"> 

  <style>
    :root {
      --bg: #020B18;
      --accent: #00CFFF;
      --accent-glow: rgba(0,207,255,0.42);
      --purple: #A855F7;
      --purple-glow: rgba(168,85,247,0.38);
      --text: #B8DCFF;
      --muted: #4E82A0;
      --dim: #081E35;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000000;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
      position: relative;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 100% 50% at 50% -5%, rgba(0,150,255,0.16) 0%, transparent 65%),
        radial-gradient(ellipse 50% 45% at 100% 100%, rgba(80,0,200,0.08) 0%, transparent 55%),
        linear-gradient(var(--dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--dim) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 2px,
        rgba(0,60,140,0.06) 2px, rgba(0,60,140,0.06) 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes rgb-cycle {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes icon-pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(0,207,255,0.22); }
      50% { box-shadow: 0 0 28px rgba(0,207,255,0.55), 0 0 50px rgba(0,207,255,0.18); }
    }

    .rgb-shell {
      width: 100%;
      max-width: 960px;
      min-height: calc(100vh - 36px);
      padding: 2px;
      border-radius: 14px;
      background: linear-gradient(
        60deg,
        #ff2020, #ff7700, #ffee00,
        #00ff55, #00cfff, #0055ff,
        #9900ff, #ff00cc, #ff2020
      );
      background-size: 400% 400%;
      animation: rgb-cycle 4s linear infinite;
      box-shadow:
        0 0 25px rgba(0,150,255,0.40),
        0 0 60px rgba(0,100,255,0.20),
        0 0 120px rgba(0,50,255,0.10),
        0 28px 70px rgba(0,0,0,0.75);
      display: flex;
      z-index: 1;
    }

    #page-content {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, #080E1E 0%, #060B18 100%);
    }

    .custom-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
    }

    .topbar {
      background: linear-gradient(135deg, #08152E 0%, #050E20 100%);
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(0,207,255,0.25);
    }

    .topbar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,207,255,0.70), transparent);
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,207,255,0.45), transparent);
      box-shadow: 0 0 10px rgba(0,207,255,0.40);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, rgba(0,207,255,0.18), rgba(0,207,255,0.05));
      border: 1px solid rgba(0,207,255,0.38);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      animation: icon-pulse 3s ease-in-out infinite;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,207,255,0.55);
    }

    .brand-sub {
      font-size: 0.67rem;
      font-weight: bold;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 2.5px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      border: 1px solid rgba(0,207,255,0.38);
      background: rgba(0,207,255,0.08);
      padding: 4px 10px;
      border-radius: 5px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .main-content {
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .hero {
      text-align: center;
      padding: 4px 0 12px;
    }

    .exploit-image {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 4px auto 8px auto;
      filter: drop-shadow(0 0 18px rgba(0,207,255,0.22));
    }

    h1 {
      text-align: center;
      margin: 5px 0 7px;
      color: #fff;
      font-size: 1.35rem;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0,207,255,0.45);
    }

    #UA {
      text-align: center;
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    hr {
      border: 0;
      height: 1px;
      margin: 8px 0 14px;
      background: linear-gradient(90deg, transparent, rgba(0,207,255,0.35), transparent);
      box-shadow: 0 0 10px rgba(0,207,255,0.18);
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      background: rgba(3,8,18,0.55);
      border: 1px solid rgba(0,207,255,0.16);
      border-radius: 10px;
      padding: 15px;
      box-shadow: inset 0 0 25px rgba(0,120,255,0.035);
    }

    #kernel-options {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      direction: ltr;
    }

    #kernel-options input[type="radio"] {
      accent-color: var(--accent);
    }

    #kernel-options label {
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 7px 13px;
      border: 1px solid rgba(168,85,247,0.30);
      border-radius: 6px;
      background: rgba(168,85,247,0.06);
      text-shadow: 0 0 8px rgba(0,207,255,0.18);
      cursor: pointer;
    }
    #jeilbrek {
      border: 1px solid rgba(0,207,255,0.50);
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(0,207,255,0.15), rgba(0,100,180,0.08));
      color: #fff;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0,207,255,0.45);
      box-shadow: 0 0 18px rgba(0,207,255,0.10);
      cursor: pointer;
    }

    #jeilbrek:hover {
      box-shadow: 0 0 26px rgba(0,207,255,0.28);
      border-color: rgba(0,207,255,0.75);
    }

    .autoJb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    #autoJbLabel {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #autoJbInput {
      accent-color: var(--purple);
    }
    .main-layout {
      margin-top: 13px;
    }
    #console {
      background: rgba(2, 5, 12, 0.72) !important;
      border: 1px solid rgba(168,85,247,0.30) !important;
      border-radius: 8px;
      padding: 12px 14px;
      color: #6A9EBE;
      font: 12px/1.65 Consolas, "Courier New", monospace;
      min-height: 135px;
      max-height: 270px;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: inset 0 0 25px rgba(80,0,160,0.035), 0 0 15px rgba(168,85,247,0.05);
      scrollbar-width: thin;
      scrollbar-color: rgba(168,85,247,0.30) transparent;
    }
    #console::-webkit-scrollbar {
      width: 5px;
    }
    #console::-webkit-scrollbar-track {
      background: transparent;
    }
    #console::-webkit-scrollbar-thumb {
      background: rgba(168,85,247,0.30);
      border-radius: 3px;
    }
    .social-console {
      margin-top: 12px;
      background: rgba(3,8,18,0.72);
      border: 1px solid rgba(168,85,247,0.28);
      border-radius: 8px;
      overflow: hidden;
    }
    .social-console-title {
      padding: 8px 12px;
      text-align: center;
      color: #fff;
      font-size: 0.82rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--purple-glow);
      border-bottom: 1px solid rgba(168,85,247,0.14);
    }
    .social-text {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      padding: 11px 10px 12px;
      direction: rtl;
    }
    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 105px;
    }
    .social-label {
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-shadow: 0 0 7px rgba(0,207,255,0.18);
    }
    .social-item span:last-child {
      width: 100%;
      text-align: center;
      padding: 6px 10px;
      border: 1px solid rgba(168,85,247,0.30);
      border-radius: 6px;
      background: rgba(168,85,247,0.06);
      color: #B8DCFF;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,207,255,0.35);
    }
    .foot-inner {
      text-align: center;
      font-size: 0.62rem;
      color: #132A3E;
      padding: 6px 0;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(0,100,180,0.08);
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .topbar {
        padding: 10px 14px;
      }
      .brand-name {
        font-size: 0.82rem;
      }
      .brand-sub {
        font-size: 0.58rem;
      }

      .main-content {
        padding: 12px;
      }

      .exploit-image {
        width: 145px;
        height: 145px;
      }

      h1 {
        font-size: 1.05rem;
      }

      .social-text {
        gap: 7px;
      }

      .social-item {
        min-width: 0;
        flex: 1;
      }

      .social-label {
        font-size: 0.65rem;
      }

      .social-item span:last-child {
        font-size: 0.68rem;
        padding: 6px 5px;
      }
    }
  </style>
</head> 

<body> 
  <!-- محتويات الصفحة -->
  <div class="rgb-shell">
    <div id="page-content">

      <header class="topbar">
        <div class="brand">
           <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="13,2 4,14 12,14 11,22 20,10 12,10" 
             fill="#00CFFF" 
             stroke="#00CFFF" 
             stroke-width="0.5"/>
  </svg>
          <div>
            <div class="brand-name">VOLT JAILBREAK</div>
            <div class="brand-sub">+962770582845</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="version-tag">10.00 - 11.02</div>
        </div>
      </header>

      <main class="main-content">

        <div class="hero">
          <h1>VOLT +962770582845</h1> 
          <h3 id="UA">يعمل على:</h3> 
        </div>

        <hr> 

        <div class="btn-container"> 
          <form id="kernel-options"> 
            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl"> 
            <label for="netctrl-exploit">NetCtrl</label> 
            <input type="radio" name="kernel" id="lapse-exploit" value="lapse"> 
            <label for="lapse-exploit">Lapse</label> 
          </form> 

          <button id="jeilbrek"> بدء </button> 

          <div class="autoJb"> 
            <label for="autoJbInput" id="autoJbLabel">جيلبريك تلقائي</label> 
            <input class="mt-2" id="autoJbInput" type="checkbox"> 
          </div> 
        </div> 

        <div class="main-layout"> 
          <pre id="console">جارٍ تخزين الملفات للعمل دون اتصال... 0%</pre> 

          <div class="social-console">
            <div class="social-console-title">لا تنسى تتابعنا ليصلك كل جديد</div>
            <div class="social-text">
              <div class="social-item">
                <div class="social-label">فيسبوك</div>
                <span>VOLT - فولت</span>
              </div>
              <div class="social-item">
                <div class="social-label">إنستقرام</div>
                <span>VOLTJO</span>
              </div>
              <div class="social-item">
                <div class="social-label">واتساب</div>
                <span>00962770582845</span>
              </div>
            </div>
          </div>
        </div>

      </main>

      <div class="foot-inner">VOLT</div>

    </div>
  </div>

<script> 
    var scriptsLoaded = false; 

    function triggerScripts() { 
      if (scriptsLoaded) return; 
      scriptsLoaded = true; 

      var consoleLog = document.getElementById('console'); 
      if (consoleLog) consoleLog.innerText += "\nجارٍ تحميل main.js و script.js..."; 

      var s1 = document.createElement('script'); 
      s1.src = 'src/main.js'; 
      s1.onerror = function() { 
        if (consoleLog) consoleLog.innerText += "\n❌ خطأ: تعذر تحميل src/main.js (تحقق من المسار/الملف)"; 
      }; 

      s1.onload = function() { 
        var s2 = document.createElement('script'); 
        s2.src = 'includes/script.js'; 
        s2.onerror = function() { 
          if (consoleLog) consoleLog.innerText += "\n❌ خطأ: تعذر تحميل includes/script.js (تحقق من المسار/الملف)"; 
        }; 
        document.body.appendChild(s2); 
      }; 

      document.body.appendChild(s1); 
    } 

    if (window.applicationCache) { 
      var appCache = window.applicationCache; 
      var consoleLog = document.getElementById('console'); 

      appCache.addEventListener('progress', function(e) { 
        if (e.lengthComputable && consoleLog) { 
          var percent = Math.round((e.loaded / e.total) * 100); 
          consoleLog.innerText = "جارٍ تخزين الملفات للعمل دون اتصال... " + percent + "%"; 
        } 
      }, false); 

      appCache.addEventListener('cached', function() { 
        if (consoleLog) consoleLog.innerText = "اكتمل التخزين المؤقت للعمل دون اتصال (100%)!"; 
        triggerScripts(); 
      }, false); 

      appCache.addEventListener('noupdate', function() { 
        if (consoleLog) consoleLog.innerText = "ذاكرة التخزين المؤقت للعمل دون اتصال جاهزة."; 
        triggerScripts(); 
      }, false); 

      appCache.addEventListener('error', function() { 
        if (consoleLog) consoleLog.innerText = "خطأ في التخزين المؤقت/وضع عدم الاتصال."; 
        triggerScripts(); 
      }, false); 

      setTimeout(function() { 
        if (!scriptsLoaded) { 
          if (consoleLog) consoleLog.innerText += "\n[انتهت المهلة] ..."; 
          triggerScripts(); 
        } 
      }, 3000); 

    } else { 
      triggerScripts(); 
    } 
</script> 

</body> 
</html>
