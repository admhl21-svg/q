<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT HOME</title>
<style>
    :root {
        --bg:           #020B18;
        --surface:      #060F24;
        --accent:       #00CFFF;
        --accent-glow:  rgba(0,207,255,0.42);
        --poops-c:      #A855F7;
        --poops-glow-c: rgba(168,85,247,0.38);
        --success:      #00E676;
        --error:        #FF5252;
        --warn:         #FFD600;
        --text:         #B8DCFF;
        --text-muted:   #4E82A0;
        --text-dim:     #081E35;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        background-image:
            radial-gradient(ellipse 100% 50% at 50% -5%, rgba(0,150,255,0.16) 0%, transparent 65%),
            radial-gradient(ellipse 50% 45% at 100% 100%, rgba(80,0,200,0.08) 0%, transparent 55%),
            linear-gradient(var(--text-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--text-dim) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        position: relative;
    }

    /* Scanlines */
    body::after {
        content: '';
        position: fixed; inset: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px, transparent 2px,
            rgba(0,60,140,0.06) 2px, rgba(0,60,140,0.06) 3px
        );
        pointer-events: none;
        z-index: 9999;
    }

    /* ═══ RGB BORDER ═══ */
    @keyframes rgb-cycle {
        0%   { background-position: 0%   50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0%   50%; }
    }

    .rgb-shell {
        width: 100%;
        max-width: 960px;
        height: calc(100vh - 36px);
        padding: 2px;
        border-radius: 14px;
        background: linear-gradient(
            60deg,
            #ff2020, #ff7700, #ffee00,
            #00ff55, #00cfff, #0055ff,
            #9900ff, #ff00cc, #ff2020
        );
        background-size: 400% 400%;
        animation: rgb-cycle 4s linear infinite;
        box-shadow:
            0 0 25px  rgba(0,150,255,0.40),
            0 0 60px  rgba(0,100,255,0.20),
            0 0 120px rgba(0,50,255,0.10),
            0 28px 70px rgba(0,0,0,0.75);
        display: flex;
        flex-direction: column;
        z-index: 1;
    }

    .shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        min-height: 0;
    }

    /* ── TOPBAR ──────────────────────────── */
    .topbar {
        background: linear-gradient(135deg, #08152E 0%, #050E20 100%);
        padding: 13px 22px;
        display: flex; align-items: center; justify-content: space-between;
        flex-shrink: 0;
        position: relative; overflow: hidden;
    }

    .topbar::before {
        content: '';
        position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 55%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.70), transparent);
    }

    .topbar::after {
        content: '';
        position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,207,255,0.45), transparent);
        box-shadow: 0 0 10px rgba(0,207,255,0.40);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
        width: 38px; height: 38px;
        background: linear-gradient(135deg, rgba(0,207,255,0.18), rgba(0,207,255,0.05));
        border: 1px solid rgba(0,207,255,0.38);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem;
        animation: icon-pulse 3s ease-in-out infinite;
    }

    @keyframes icon-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(0,207,255,0.22); }
        50%       { box-shadow: 0 0 28px rgba(0,207,255,0.55), 0 0 50px rgba(0,207,255,0.18); }
    }

    .brand-name {
        font-size: 1rem; font-weight: bold; letter-spacing: 3px;
        text-transform: uppercase; color: #fff;
        text-shadow: 0 0 20px rgba(0,207,255,0.55);
    }

    .brand-sub {
        font-size: 0.67rem; font-weight: bold; color: var(--text-muted);
        margin-top: 3px; letter-spacing: 2.5px;
    }

    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .poops-badge {
        font-size: 0.66rem; font-weight: 800; letter-spacing: 2px;
        color: var(--poops-c);
        border: 1px solid rgba(168,85,247,0.40);
        background: rgba(168,85,247,0.09);
        padding: 4px 10px; border-radius: 5px;
        text-shadow: 0 0 10px var(--poops-glow-c);
        animation: poops-glow-anim 2.5s ease-in-out infinite;
    }

    @keyframes poops-glow-anim {
        0%, 100% { box-shadow: 0 0 12px rgba(168,85,247,0.12); }
        50%       { box-shadow: 0 0 22px rgba(168,85,247,0.35); }
    }

    .version-tag {
        font-size: 0.66rem; font-weight: 800; letter-spacing: 2px;
        color: var(--accent);
        border: 1px solid rgba(0,207,255,0.38);
        background: rgba(0,207,255,0.08);
        padding: 4px 10px; border-radius: 5px;
        text-shadow: 0 0 10px var(--accent-glow);
    }

    /* ── MAIN CONTENT ────────────────────── */
    #wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: linear-gradient(180deg, #080E1E 0%, #060B18 100%);
        padding: 14px 18px 12px;
        gap: 11px;
        position: relative;
    }

    #wrap::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,120,255,0.05) 0%, transparent 60%);
        pointer-events: none;
    }

    /* ── SHOP INFO GRID ──────────────────── */
    .shop-info {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        direction: rtl;
        position: relative; z-index: 1;
        flex-shrink: 0;
    }

    .info-card {
        background: rgba(3, 10, 24, 0.78);
        border: 1px solid rgba(0,207,255,0.18);
        border-radius: 8px;
        padding: 10px 12px;
        min-width: 0;
        box-shadow: inset 0 0 18px rgba(0,120,255,0.035), 0 0 12px rgba(0,120,255,0.04);
    }

    .info-label {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 4px;
        text-transform: uppercase;
    }

    .info-value {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #fff;
        line-height: 1.45;
        text-shadow: 0 0 10px rgba(0,207,255,0.18);
        overflow-wrap: anywhere;
    }

    /* ── STATE ───────────────────────────── */
    #state {
        grid-column: 1 / -1;          /* يمتد على عمودَين */
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #fff;
        text-shadow: 0 0 20px rgba(0,207,255,0.35);
        direction: rtl;
        text-align: center;
        position: relative; z-index: 1;
        line-height: 1.4;
        padding: 8px 2px;
    }

    #state.ok   { color: var(--success); text-shadow: 0 0 20px rgba(0,230,118,0.50); }
    #state.bad  { color: var(--error);   text-shadow: 0 0 20px rgba(255,82,82,0.55); }
    #state.warn {
        color: var(--warn);
        text-shadow: 0 0 20px rgba(255,214,0,0.50);
        animation: warn-pulse 1.6s ease-in-out infinite;
    }

    @keyframes warn-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.40; }
    }

    /* ── CONSOLE WRAP ────────────────────── */
    .console-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
        z-index: 1;
    }

    .console-bar {
        background: rgba(3, 8, 18, 0.95);
        border: 1px solid rgba(168,85,247,0.28);
        border-bottom: 1px solid rgba(168,85,247,0.12);
        border-radius: 8px 8px 0 0;
        padding: 7px 14px;
        display: flex; align-items: center; gap: 10px;
        flex-shrink: 0;
    }

    .console-title {
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
        flex: 1;
        text-align: center;
        text-shadow: 0 0 8px var(--poops-glow-c);
    }

    #out {
        flex: 1;
        min-height: 0;
        white-space: pre-wrap;
        font: 12px/1.65 Consolas, "Courier New", monospace;
        background: rgba(2, 5, 12, 0.35);
        border: 1px solid rgba(168,85,247,0.22);
        border-top: none;
        border-radius: 0 0 8px 8px;
        padding: 12px 14px;
        overflow-y: auto;
        text-align: left;
        color: #6A9EBE;
        scrollbar-width: thin;
        scrollbar-color: rgba(168,85,247,0.30) transparent;
    }

    #out::-webkit-scrollbar { width: 5px; }
    #out::-webkit-scrollbar-track { background: transparent; }
    #out::-webkit-scrollbar-thumb {
        background: rgba(168,85,247,0.30);
        border-radius: 3px;
    }

    /* ── SOCIAL ──────────────────────────── */
    .social-text {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 60px;
        padding: 8px 0;
        flex-wrap: wrap;
    }

    .social-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .social-label {
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        color: white;
        text-shadow: 0 0 8px var(--poops-glow-c);
    }

    .social-item span {
        padding: 5px 14px;
        border: 1px solid rgba(168,85,247,0.30);
        border-radius: 6px;
        background: rgba(168,85,247,0.06);
        color: #B8DCFF;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(0,207,255,0.35);
    }

    .ok   { color: #00E676; }
    .bad  { color: #FF5252; }
    .warn { color: #FFD600; }
    /* ── RESPONSIVE ──────────────────────── */
    @media (max-width: 480px) {
        body    { padding: 10px; }
        .topbar { padding: 10px 14px; }
        #wrap   { padding: 12px 12px 10px; }
        #state  { font-size: 0.9rem; }
        .shop-info { grid-template-columns: 1fr; gap: 7px; }
        .info-card  { padding: 8px 10px; }
        .social-text { gap: 30px; }
    }
</style>
</head>
<body>

<div class="rgb-shell">
  <div class="shell">

    <header class="topbar">
        <div class="brand">
             <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="13,2 4,14 12,14 11,22 20,10 12,10" 
             fill="#00CFFF" 
             stroke="#00CFFF" 
             stroke-width="0.5"/>
  </svg>
            <div>
                <div class="brand-name">VOLT PS4 JAILBREAK</div>
                <div class="brand-sub">+962770582845</div>
            </div>
        </div>
        <div class="topbar-right">
            <div class="poops-badge">HACK</div>
            <div class="version-tag">V4.0</div>
        </div>
    </header>

    <div id="wrap">

        <!-- معلومات المحل -->
        <div class="shop-info">
            <div class="info-card">
                <div class="info-label">اسم المحل</div>
                <div class="info-value">VOLT</div>
            </div>
            <div class="info-card">
                <div class="info-label">رقم المحل</div>
                <div class="info-value" dir="ltr">+962770582845</div>
            </div>
            <div class="info-card" style="grid-column:1/-1;">
                <div class="info-label">موقع المحل</div>
                <div class="info-value">الزرقاء — الوسط التجاري — شارع الملك فيصل</div>
            </div>

            <!-- حالة الكشف — تمتد على عمودين -->
            <div id="state" class="warn">⏳ جاري كشف الإصدار...</div>
        </div>

        <!-- صندوق السوشيال ميديا -->
        <div class="console-wrap">
            <div class="console-bar">
                <span class="console-title">لاتنسى تتابعنا ليصلك كل جديد</span>
            </div>
            <div id="out">
                <div class="social-text" dir="rtl">
                    <div class="social-item">
                        <div class="social-label">فيسبوك</div>
                        <span>VOLT - فولت</span>
                    </div>
                    <div class="social-item">
                        <div class="social-label">إنستقرام</div>
                        <span>VOLTJO</span>
                    </div>
                    <div class="social-item">
                        <div class="social-label">واتساب</div>
                        <span>00962770582845</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById('state');

    /* ── تحديث نص الحالة ── */
    function setState(msg, cls) {
        stateEl.textContent = msg;
        stateEl.className   = cls || '';
    }

    /* ── عداد تنازلي ثم توجيه ── */
    function redirect(target, label) {
        var secs = 10;

        function tick() {
            setState(
                '✅ تم الكشف: ' + label
                + ' — جاري التوجيه خلال ' + secs + ' ثانية...',
                'ok'
            );
            if (secs === 0) {
                window.location.href = target;
                return;
            }
            secs--;
            setTimeout(tick, 1000);
        }

        tick();
    }
    function processDevice() {
        var ua    = navigator.userAgent;
        var isPS4 = /PlayStation 4|PS4/i.test(ua);

        if (!isPS4) {
            setState('⚠️ هذه الصفحة مخصصة فقط للبلايستيشن فور', 'bad');
            return;
        }
        var m = ua.match(/(?:PlayStation 4|PS4)[\s\/]+([\d\.]+)/i);
        if (!m || !m[1]) {
            setState('❌ تعذّر قراءة إصدار النظام', 'bad');
            return;
        }
       var fw  = parseFloat(m[1]);
        var ver = m[1];

        if (fw >= 5.00 && fw <= 9.60) {
            redirect('505_960/index.html',   'إصدار ' + ver);
        } else if (fw >= 10.00 && fw <= 11.02) {
            redirect('1000_1102/index.html', 'إصدار ' + ver);
        } else if (fw >= 11.50 && fw <= 13.00) {
            redirect('1150-1300/index.html', 'إصدار ' + ver);
        } else if (fw >= 13.02 && fw<=13.50) {
            redirect('1302-1350/index.html', 'إصدار ' + ver);
        }else if (fw >= 13.52 && fw<= 14.00) {
            redirect('1352-1400/index.html', 'إصدار ' + ver);
        } else {
            setState('❌ إصدار ' + ver + ' غير مدعوم حالياً', 'bad');
        }
    }
    /* نفّذ بعد اكتمال تحميل الصفحة تماماً — نفس window.onload في الكود الأصلي */
    if (document.readyState === 'complete') {
        processDevice();
    } else {
        window.addEventListener('load', processDevice);
    }
})();
</script>
</body>
</html>
